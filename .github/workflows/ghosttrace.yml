name: GhostTrace
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  ghosttrace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.ghosttrace            # action bundled in this repo
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}   # optional; delete if unused
          # fail-on-score: 80                                    # uncomment to block risky PRs
